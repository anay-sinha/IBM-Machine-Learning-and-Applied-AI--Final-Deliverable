[tool.pytest.ini_options]
testpaths     = ["tests"]
asyncio_mode  = "auto"
addopts       = "-v --tb=short --cov=. --cov-report=term-missing --cov-report=html:reports/coverage"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source     = ["."]
omit       = ["tests/*", "setup.py", "conftest.py"]
branch     = true

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under   = 70
